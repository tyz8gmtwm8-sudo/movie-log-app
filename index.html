<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>movie-log-app</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- 画面上部の帯（アプリ名とログアウトボタン） -->
    <header class="app-bar">
      <h1 class="app-title">🎬 movie-log-app</h1>
      <div class="app-bar-right" id="app-bar-right">
        <span id="user-email" class="user-email"></span>
        <button id="logout-button" type="button" class="btn-ghost">
          ログアウト
        </button>
      </div>
    </header>

    <main class="container">
      <!-- ================= ログイン / 新規登録 画面 ================= -->
      <section id="auth-section" class="card">
        <!-- メッセージ表示欄（エラーや成功のお知らせ） -->
        <p id="message-box" class="message" hidden></p>

        <!-- ログインフォーム -->
        <div id="login-box">
          <h2>ログイン</h2>
          <form id="login-form">
            <label>
              メールアドレス
              <input type="email" id="login-email" required autocomplete="email" />
            </label>
            <label>
              パスワード
              <input
                type="password"
                id="login-password"
                required
                autocomplete="current-password"
              />
            </label>
            <button type="submit" class="btn-primary">ログイン</button>
          </form>
          <p class="switch-text">
            アカウントがない方は
            <a href="#" id="show-signup">新規登録</a>
          </p>
        </div>

        <!-- 新規登録フォーム（最初は非表示） -->
        <div id="signup-box" hidden>
          <h2>新規登録</h2>
          <form id="signup-form">
            <label>
              メールアドレス
              <input type="email" id="signup-email" required autocomplete="email" />
            </label>
            <label>
              パスワード（6文字以上）
              <input
                type="password"
                id="signup-password"
                required
                autocomplete="new-password"
              />
            </label>
            <button type="submit" class="btn-primary">登録する</button>
          </form>
          <p class="switch-text">
            すでにアカウントをお持ちの方は
            <a href="#" id="show-login">ログイン</a>
          </p>
        </div>
      </section>

      <!-- ================= ログイン後の画面：映画を登録 ================= -->
      <section id="app-section" class="card" hidden>
        <h2>映画を登録</h2>

        <!-- タイトルで検索 -->
        <form id="search-form" class="search-form">
          <input
            type="text"
            id="search-input"
            placeholder="映画のタイトルで検索"
            required
          />
          <button type="submit" class="btn-primary">検索</button>
        </form>

        <!-- メッセージ表示欄 -->
        <p id="register-message" class="message" hidden></p>

        <!-- 検索結果の一覧 -->
        <ul id="search-results" class="search-results" hidden></ul>

        <!-- 登録フォーム（映画を選ぶと表示される） -->
        <form id="register-form" class="register-form" hidden>
          <div class="selected-movie">
            <img id="selected-poster" alt="ポスター" hidden />
            <div>
              <p id="selected-title" class="selected-title"></p>
              <p id="selected-overview" class="selected-overview"></p>
            </div>
          </div>

          <fieldset>
            <legend>評価（0.5刻み）</legend>
            <div class="star-display" aria-hidden="true">
              <div class="star-base">★★★★★</div>
              <div class="star-fill" id="star-fill">★★★★★</div>
            </div>
            <div class="rating-row">
              <input
                type="range"
                id="rating-input"
                min="0.5"
                max="5"
                step="0.5"
                value="3"
              />
              <span><strong id="rating-value">3.0</strong> / 5.0</span>
            </div>
          </fieldset>

          <fieldset>
            <legend>ジャンル</legend>
            <div id="genre-list" class="genre-list"></div>
          </fieldset>

          <label>
            感想
            <textarea id="review-input" rows="4" placeholder="自由に書けます"></textarea>
          </label>

          <label class="checkbox-label">
            <input type="checkbox" id="spoiler-input" />
            ネタバレを含む
          </label>

          <label>
            鑑賞日
            <input type="date" id="watched-input" />
          </label>

          <label>
            鑑賞方法
            <select id="method-input">
              <option value="">未選択</option>
              <option value="映画館">映画館</option>
              <option value="配信">配信</option>
              <option value="ディスク">ディスク（DVD / Blu-ray）</option>
              <option value="その他">その他</option>
            </select>
          </label>

          <div class="form-actions">
            <button type="submit" class="btn-primary">この内容で登録</button>
            <button type="button" id="cancel-register" class="btn-secondary">
              キャンセル
            </button>
          </div>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      映画情報の提供：The Movie Database (TMDB)。本アプリは TMDB
      が承認・認定したものではありません。
    </footer>

    <!-- Supabase のライブラリ（外部から読み込み） -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 接続情報 → クライアント作成 → 各処理 の順に読み込む -->
    <script src="js/config.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/tmdb.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>
